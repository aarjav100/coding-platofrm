name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Test frontend
        working-directory: frontend
        run: npm test --if-present

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint --if-present

      - name: Test backend
        working-directory: backend
        run: npm test --if-present

      - name: Trigger backend deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Triggering backend deploy..."
          curl --fail --show-error --silent -X POST "${{ https://api.render.com/deploy/srv-d7a7ts3uibrs73frsmu0?key=oHubwEOr9V0 }}"
          echo "Backend deploy hook triggered"

      - name: Trigger frontend deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Triggering frontend deploy..."
          curl --fail --show-error --silent -X POST "${{ https://api.render.com/deploy/srv-d7a7vashg0os73bdjt80?key=jWPVdR2cfdw }}"
          echo "Frontend deploy hook triggered"