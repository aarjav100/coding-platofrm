<style>body {
    background-color: #111318;
    color: #e2e2e8;
    font-family: "DM Sans", sans-serif;
    position: relative
    }

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.03;
    z-index: 9999;

<body class="bg-surface flex flex-col min-h-screen">
<!-- Top Navigation Bar - Context: Transactional Suppression implies minimal branding here, but following JSON structure for brand identity -->
<header class="bg-[#0c0e12]/80 backdrop-blur-md fixed top-0 z-50 w-full">
<div class="flex items-center justify-between px-8 py-4 w-full max-w-screen-2xl mx-auto">
<div class="text-2xl font-black tracking-tighter text-emerald-500 font-['Space_Grotesk']">
                NexCode
            </div>
<div class="flex items-center gap-6">
<span class="text-slate-400 font-['Space_Grotesk'] font-medium tracking-tight text-sm">Already a member?</span>
<a class="text-emerald-500 font-bold hover:text-emerald-300 transition-colors duration-200" href="#">Log In</a>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-4 pt-24 pb-12 relative overflow-hidden">
<!-- Ambient Background Glows -->
<div class="absolute top-1/4 -left-20 w-96 h-96 bg-primary/10 blur-[100px] rounded-full"></div>
<div class="absolute bottom-1/4 -right-20 w-80 h-80 bg-secondary/5 blur-[120px] rounded-full"></div>
<div class="w-full max-w-md z-10">
<!-- Asymmetric Editorial Header -->
<div class="mb-10 text-left">
<h1 class="font-headline text-5xl font-black text-on-surface tracking-tighter leading-none mb-2">
                    INITIATE <span class="text-primary italic">BUILD</span>
</h1>
<p class="text-on-surface-variant font-mono text-sm tracking-wide opacity-80 uppercase">
                    Step into the obsidian architecture.
                </p>
</div>
<!-- Registration Card (Glassmorphism) -->
<div class="bg-surface-container/60 backdrop-blur-xl p-8 shadow-2xl relative overflow-hidden group">
<!-- Intentional Asymmetry: Accent line -->
<div class="absolute top-0 left-0 w-1 h-full bg-primary/20 group-hover:bg-primary transition-colors duration-500"></div>
<form class="space-y-6">
<!-- Full Name -->
<div class="space-y-1">
<label class="block text-xs font-mono uppercase tracking-widest text-on-surface-variant opacity-60 ml-1">Full Name</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-on-surface font-body py-3 transition-all duration-300 placeholder:text-on-surface/20" placeholder="ARCHITECT NAME" type="text"/>
<div class="absolute bottom-0 left-0 w-0 h-[2px] bg-primary transition-all duration-500 focus-within:w-full"></div>
</div>
</div>
<!-- Email -->
<div class="space-y-1">
<label class="block text-xs font-mono uppercase tracking-widest text-on-surface-variant opacity-60 ml-1">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-on-surface font-body py-3 transition-all duration-300 placeholder:text-on-surface/20" placeholder="NODE@NEXCODE.IO" type="email"/>
</div>
</div>
<!-- Username -->
<div class="space-y-1">
<label class="block text-xs font-mono uppercase tracking-widest text-on-surface-variant opacity-60 ml-1">Handle</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-on-surface font-body py-3 transition-all duration-300 placeholder:text-on-surface/20" placeholder="USER_IDENTIFIER" type="text"/>
</div>
</div>
<!-- Password -->
<div class="space-y-1">
<label class="block text-xs font-mono uppercase tracking-widest text-on-surface-variant opacity-60 ml-1">Security Key</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-on-surface font-body py-3 transition-all duration-300 placeholder:text-on-surface/20" placeholder="••••••••••••" type="password"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-center space-x-3 py-2">
<div class="relative flex items-center">
<input class="h-4 w-4 rounded-none bg-surface-container-highest border-outline-variant text-primary focus:ring-offset-background focus:ring-primary" id="terms" type="checkbox"/>
</div>
<label class="text-xs font-body text-on-surface-variant leading-tight" for="terms">
                            I agree to the <a class="text-primary hover:underline transition-all" href="#">Terms &amp; Conditions</a> and data protocol.
                        </label>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="glow-button w-full bg-primary-container text-on-primary-container font-headline font-bold py-4 tracking-tighter uppercase text-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-all" type="submit">
                            Create Account
                            <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-8 flex items-center justify-between text-[10px] font-mono tracking-widest opacity-40 uppercase">
<span>Precision Secured</span>
<span>V 2.0.4-BETA</span>
</div>
</div>
</div>
</main>
<!-- Footer - Mapping from Shared Components JSON -->
<footer class="bg-[#0c0e12] flex flex-col md:flex-row justify-between items-center px-12 py-8 w-full border-t border-[#333539] mt-auto">
<div class="mb-4 md:mb-0">
<span class="text-lg font-bold text-emerald-500 font-['Space_Grotesk']">NexCode</span>
<p class="text-slate-500 font-['Space_Grotesk'] text-[10px] uppercase tracking-widest mt-1">
                © 2024 NexCode. Precision engineered for the Obsidian Architect.
            </p>
</div>
<div class="flex flex-wrap justify-center gap-8">
<a class="font-['Space_Grotesk'] text-xs uppercase tracking-widest text-slate-500 hover:text-emerald-400 transition-colors" href="#">Documentation</a>
<a class="font-['Space_Grotesk'] text-xs uppercase tracking-widest text-slate-500 hover:text-emerald-400 transition-colors" href="#">Terms of Service</a>
<a class="font-['Space_Grotesk'] text-xs uppercase tracking-widest text-slate-500 hover:text-emerald-400 transition-colors" href="#">Privacy Policy</a>
<a class="font-['Space_Grotesk'] text-xs uppercase tracking-widest text-slate-500 hover:text-emerald-400 transition-colors" href="#">Contact Support</a>
</div>
</footer>
